<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WSTX Station</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main><header><span class="eyebrow">WSTX · STATION LINK</span><span id="connection" role="status">Connecting</span></header><h1>Your station,<br>within reach.</h1><p class="intro">A lightweight link to your remote radio station.</p><section aria-label="Station status"><dl><div><dt>Server version</dt><dd id="version">—</dd></div><div><dt>Radio</dt><dd id="radio">Waiting for station</dd></div><div><dt>Link profile</dt><dd>Minimal · 32 kbit/s</dd></div></dl></section><form id="login" hidden><label for="token">Station access token</label><input id="token" type="password" autocomplete="current-password" required><button>Connect securely</button><p id="login-error" role="alert"></p></form><footer>Status connection · Radio control is not configured</footer></main></body></html>

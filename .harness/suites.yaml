- suite: decoder-correctness
  cost: 2
  # The decode correctness, thread-parity and jt9-parity passes of decoder_signal: the
  # ordinary named passes minus the two that assert a wall-clock bound (the 50 ms
  # cooperative quantum, with its partial-cancellation case, and the busy-period latency).
  # decoder-quality runs all seventeen, bound to its artifact, and the resource matrix when
  # a timing input changes (every production decoder source).
  run: >-
    cargo test --release --locked --test decoder_signal -- --test-threads=1
    --skip release_runtime_and_overlapping_window_history
    --skip cooperative_quanta_and_partial_cancellation
    --skip live_busy_period_publishes_every_decode_promptly
  paths:
  - server/src/decoder/
  - server/src/lib.rs
  - server/tests/decoder_signal.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  # Selected by what decoder-quality does not time but these passes read: the decoder
  # fixtures (the jt9 parity corpus, baselines, vectors) and the library root. A production
  # decoder source, decoder_signal.rs or a Cargo pin selects decoder-quality, which runs
  # these passes too (bound to its artifact). The decoder's *_test.rs files are not in this
  # binary (wstx-rust-decoder runs them).
  select:
  - fixtures/decoder/
  - server/src/lib.rs
  build: cargo test --release --locked --test decoder_signal --no-run
  # CPU-heavy (12-thread busy-period decode): kept apart from the timing suites that run
  # beside other groups (gate.timing_alone: false).
  exclusive: [link-measurement]
  needs: "Pinned Rust, 64-bit Windows. The decoder_signal correctness passes: the original quality cases, independent waveforms, gain invariance, unmodulated and wrong-mode sources, CRC/payload retention, forged-cache refusal, phase-drift/dynamic-range regressions, official recording baselines, the #56 jt9 deep-decode parity corpus, same-frequency frames, physical noise, the #57 thread parity on 1/4/12 threads (its speed-up is only printed), owned-worker cleanup and the concurrency-qualification logic. WSTX_SAMPLE_DIR, WSTX_DECODER_OFFICIAL_FT8, WSTX_DECODER_CACHE, WSTX_DECODER_VECTORS and WSTX_DECODER_SYNCHRONIZATION name the verified inputs; missing inputs fail closed. Not a measurement: it runs beside other groups."

- suite: decoder-quality
  cost: 2
  run: |
    set -euo pipefail
    run_dir=$(mktemp -d "${HARNESS_LEDGER_DIR:?}/decoder-resource.XXXXXX")
    python -m unittest discover -s tools -p test_windows_resource_job.py -q
    python -m unittest discover -s tools -p test_windows_process_metrics.py -q
    cargo test --release --locked --test decoder_signal --message-format=json -- --test-threads=1 --skip release_runtime_and_overlapping_window_history | python tools/windows_resource_job.py resolve --stream-log "$run_dir/ordinary.log" --receipt "$run_dir/artifact.json"
    python tools/windows_resource_job.py run --case matrix --ordinary-gate --artifact-receipt "$run_dir/artifact.json"
  paths:
  - server/src/decoder/
  - server/src/lib.rs
  - server/tests/decoder_signal.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - tools/windows_resource_job.py
  - tools/test_windows_resource_job.py
  - tools/windows_process_metrics.py
  - tools/test_windows_process_metrics.py
  timing: true
  # Every production decoder source sets the measured time (checkpoint spacing, per-item
  # work, passes and budgets); the decoder's *_test.rs files and resource_observer.rs
  # (cfg(test)) are not in the measured binary, so unit-test-only and parity-fixture-only
  # changes run decoder-correctness alone. A new decoder module is declared in mod.rs,
  # which is listed.
  timing_inputs:
  - server/src/decoder/apriori.rs
  - server/src/decoder/baseband.rs
  - server/src/decoder/bitmetrics.rs
  - server/src/decoder/channel.rs
  - server/src/decoder/coarse_ft4.rs
  - server/src/decoder/fit.rs
  - server/src/decoder/history.rs
  - server/src/decoder/mod.rs
  - server/src/decoder/parallel.rs
  - server/src/decoder/payload.rs
  - server/src/decoder/physical_ft4.rs
  - server/src/decoder/physical_sync.rs
  - server/src/decoder/search.rs
  - server/src/decoder/snr.rs
  - server/src/decoder/subtraction.rs
  - server/src/decoder/synchronization.rs
  - server/src/decoder/waveform.rs
  - server/tests/decoder_signal.rs
  - fixtures/decoder/quality-cases.json
  - fixtures/decoder/manifest.json
  - fixtures/decoder/resource-cases.json
  - fixtures/decoder/quality-audio-hashes.json
  - fixtures/decoder/independent-vector-tool/
  - fixtures/decoder/protocol-data/
  - tools/windows_resource_job.py
  - tools/test_windows_resource_job.py
  - tools/windows_process_metrics.py
  - tools/test_windows_process_metrics.py
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - server/Cargo.toml
  build: cargo test --release --locked --test decoder_signal --no-run
  exclusive: ["*"]
  needs: Pinned Rust and Python, 64-bit Windows. Preserve all original13 quality cases plus cleanup/concurrency controls; one release Cargo producer binds all17 ordinary named passes (including the #47 live-latency, #57 thread-parity and #56 jt9-parity cases) and the exact artifact, then the same original runtime case runs under the owned Job with16 configurations/40 workers/160 rounds/400 completions. API-free guardian/metrics tests precede execution. WSTX_SAMPLE_DIR and WSTX_DECODER_OFFICIAL_FT8 name verified recordings; explicitly prepared WSTX_DECODER_CACHE is required for the matrix, with verified WSTX_DECODER_VECTORS and WSTX_DECODER_SYNCHRONIZATION. In this ordinary gate a configuration whose 50 ms CPU quantum stays unmeasured after three attempts makes the matrix INCONCLUSIVE, printed as the last stderr line and exiting 77, the harness NOT RUN code; the gate lists it as NOT RUN, records not-run, never memoises it as passed and does not count it as red (#36); every measured budget stays red when exceeded. CL-007-04 runtime evidence comes only from the strict exclusive-window run, which refuses an inconclusive matrix. No radio, audio device, arbitrary command mode or network download.


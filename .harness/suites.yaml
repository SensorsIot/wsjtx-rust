- suite: decoder-quality
  cost: 2
  run: |
    set -euo pipefail
    run_dir=$(mktemp -d "${HARNESS_LEDGER_DIR:?}/decoder-resource.XXXXXX")
    python -m unittest discover -s tools -p test_windows_resource_job.py -q
    python -m unittest discover -s tools -p test_windows_process_metrics.py -q
    cargo test --release --locked --test decoder_signal --message-format=json -- --test-threads=1 --skip release_runtime_and_overlapping_window_history | python tools/windows_resource_job.py resolve --stream-log "$run_dir/ordinary.log" --receipt "$run_dir/artifact.json"
    python tools/windows_resource_job.py run --case matrix --ordinary-gate --artifact-receipt "$run_dir/artifact.json"
  paths:
  - server/src/decoder/
  - server/src/lib.rs
  - server/tests/decoder_signal.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - tools/windows_resource_job.py
  - tools/test_windows_resource_job.py
  - tools/windows_process_metrics.py
  - tools/test_windows_process_metrics.py
  select:
  - server/src/decoder/
  - server/src/lib.rs
  - server/tests/decoder_signal.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - tools/windows_resource_job.py
  - tools/test_windows_resource_job.py
  - tools/windows_process_metrics.py
  - tools/test_windows_process_metrics.py
  needs: Pinned Rust and Python, 64-bit Windows. Preserve all original13 quality cases plus cleanup/concurrency controls; one release Cargo producer binds all15 ordinary named passes (including the #47 live-latency case) and the exact artifact, then the same original runtime case runs under the owned Job with16 configurations/40 workers/160 rounds/400 completions. API-free guardian/metrics tests precede execution. WSTX_SAMPLE_DIR and WSTX_DECODER_OFFICIAL_FT8 name verified recordings; explicitly prepared WSTX_DECODER_CACHE is required for the matrix, with verified WSTX_DECODER_VECTORS and WSTX_DECODER_SYNCHRONIZATION. In this ordinary gate a configuration whose 50 ms CPU quantum stays unmeasured after three attempts makes the matrix INCONCLUSIVE, printed as the last stderr line and exiting 77, the harness NOT RUN code; the gate lists it as NOT RUN, records not-run, never memoises it as passed and does not count it as red (#36); every measured budget stays red when exceeded. CL-007-04 runtime evidence comes only from the strict exclusive-window run, which refuses an inconclusive matrix. No radio, audio device, arbitrary command mode or network download.


# Test registry (harness core/docs/standards/testing.md, "Cost levels").
#   cost: 1 compiler or syntax check, 2 offline with fixtures or stubs, 3 live read-only,
#         4 live with the test account, 5 live with effects outside the system
# cargo fmt, check and clippy run on every push as the rust pack's cost-1 checks.
- suite: wstx-rust
  cost: 2
  run: cargo test --workspace --locked --all-targets
  paths:
  - server/
  - src/
  - tests/
  - benches/
  - examples/
  - build.rs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  needs: The toolchain of rust-toolchain.toml. No radio or live station.
- suite: communication
  cost: 2
  run: cargo build --workspace --locked && npm test
  paths:
  - server/
  - client/
  - tests/
  - docs/WSTX Rust FSD.md
  - Cargo.toml
  - Cargo.lock
  - package.json
  - package-lock.json
  needs: Node 24, npm ci, npx playwright install chromium. Disposable local server, browser and link simulator; no external services.
- suite: sysml-documentation
  cost: 2
  run: python tools/sysml.py check && python -m unittest discover -s tools/sysml/tests -q
  paths:
  - docs/WSTX Rust FSD.md
  - docs/sysml/
  - tools/sysml.py
  - tools/sysml/
  needs: Python 3.12 and python tools/sysml.py setup once. Portable pinned Java/OMG Pilot in the user cache; no radio, live station or Jupyter service.

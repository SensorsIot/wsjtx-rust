# Cost 1: compiler/syntax; 2: isolated fixtures; 3: live read-only;
# 4: live test account; 5: outside effects. The Rust pack keeps its compiler checks.
# paths declares full inputs; select declares direct change ownership. depends_on
# follows downstream impact, not command prerequisites. timing: true marks a measurement
# suite, selected only by its timing_inputs or Harness-Timing: yes; exclusive/shared tags
# and build serve the parallel gate (gate.parallel). See Project-Specifics.md.
- suite: wstx-rust
  cost: 2
  # Its own Cargo output directory: `cargo test` links target/debug/wstx-rust.exe with the
  # dev-dependency features, which would replace the executable the browser groups run
  # (Windows refuses to replace a running executable). The decoder unit tests run in
  # wstx-rust-decoder.
  # --bins --test '*' plus --lib is --all-targets of this workspace (no bench or example
  # targets; --benches would also select the lib and bins). A new bench or example target
  # needs its own --bench/--example here.
  run: >-
    export CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/unit" &&
    cargo test --workspace --locked --bins --test '*' &&
    cargo test --workspace --locked --lib -- --skip decoder::
  paths:
  - server/
  - fixtures/transmit/
  - fixtures/decoder/
  - src/
  - tests/
  - benches/
  - examples/
  - build.rs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - .github/workflows/windows-rust.yml
  - docs/sysml/
  select:
  - docs/sysml/
  - server/
  - fixtures/transmit/
  - fixtures/decoder/
  - tests/fixtures/model-values/
  - src/
  - benches/
  - examples/
  - build.rs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  build: CARGO_TARGET_DIR="${CARGO_TARGET_DIR:-target}/unit" cargo test --workspace --locked --all-targets --no-run
  needs: "Pinned Rust toolchain. Windows PC; no radio or live station. Every unit and integration test of the workspace except the library's decoder:: unit tests (wstx-rust-decoder), in a separate Cargo output directory so that it runs beside the browser groups."

- suite: wstx-rust-decoder
  cost: 2
  # The decoder unit tests, optimized (debug assertions and overflow checks kept, as in the
  # test profile): wrong_dx_call_never_yields_a_false_word takes about 610 s unoptimized
  # and 27 s optimized (#56, harness#28). A separate profile directory (target/unit-opt).
  run: >-
    cargo test --locked -p wstx-rust --lib
    --config 'profile.unit-opt.inherits="release"' --config profile.unit-opt.debug-assertions=true
    --config profile.unit-opt.overflow-checks=true --profile unit-opt
    decoder::
  paths:
  - server/
  - fixtures/decoder/
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - docs/sysml/
  select:
  - docs/sysml/
  - server/src/decoder/
  - server/src/transmit/pack.rs
  - server/src/transmit/mod.rs
  - server/src/lib.rs
  - server/src/model_values.rs
  - server/Cargo.toml
  - fixtures/decoder/
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  build: >-
    cargo test --locked -p wstx-rust --lib
    --config 'profile.unit-opt.inherits="release"' --config profile.unit-opt.debug-assertions=true
    --config profile.unit-opt.overflow-checks=true --profile unit-opt --no-run
  # CPU-heavy (all cores): kept apart from the timing suites that run beside other groups.
  exclusive: [link-measurement]
  needs: "Pinned Rust toolchain. Windows PC; no radio or live station. The library's decoder:: unit tests (the complement of wstx-rust's --skip decoder::), selected by the decoder, the transmit packer its tests encode with (transmit/pack.rs and its module root), the library root, the decoder fixtures they include and the Cargo pins."


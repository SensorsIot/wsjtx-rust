# Cost 1: compiler/syntax; 2: isolated fixtures; 3: live read-only;
# 4: live test account; 5: outside effects. The Rust pack keeps its compiler checks.
# paths declares full inputs; select declares direct change ownership. depends_on
# follows downstream impact, not command prerequisites. See Project-Specifics.md.
- suite: wstx-rust
  cost: 2
  run: cargo test --workspace --locked --all-targets
  paths:
  - server/
  - src/
  - tests/
  - benches/
  - examples/
  - build.rs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - .github/workflows/windows-rust.yml
  select:
  - server/
  - src/
  - benches/
  - examples/
  - build.rs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  needs: Pinned Rust toolchain. Windows PC; no radio or live station.

- suite: protocol
  cost: 2
  run: cargo build --workspace --locked && node --test --test-concurrency=1 tests/communication.test.cjs
  paths: &browser-inputs
  - server/
  - client/
  - tests/
  - fixtures/decoder/
  - tools/recording-fixtures.cjs
  - docs/WSTX Rust FSD.md
  - .github/workflows/windows-rust.yml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - package.json
  - package-lock.json
  select:
  - server/
  - client/app.js
  - client/index.html
  - client/style.css
  - tests/communication.test.cjs
  - tests/support.cjs
  - tests/peer.cjs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - package.json
  - package-lock.json
  needs: Node 24, npm ci, Playwright Chromium. Windows PC; disposable server/browser/TLS/link simulator.

- suite: profiles
  cost: 2
  run: cargo build --workspace --locked && node --test --test-concurrency=1 tests/profiles.test.cjs
  paths: *browser-inputs
  select:
  - client/recording.js
  - client/recording.css
  - tests/profiles.test.cjs
  depends_on: [protocol]
  needs: Node 24, npm ci, Playwright Chromium. Windows PC; four disposable station profiles and real browser windows.

- suite: recording-storage
  cost: 2
  run: cargo build --workspace --locked && node --test --test-concurrency=1 --test-name-pattern="^TC-018-" tests/recording.test.cjs
  paths: *browser-inputs
  select:
  - tests/recording.test.cjs
  depends_on: [profiles, recording-fixtures]
  needs: Node 24, npm ci, Chromium and WSTX_SAMPLE_DIR with verified original recordings. Windows PC; isolated import/job/storage tests.

- suite: recording-display
  cost: 2
  run: cargo build --workspace --locked && node --test --test-concurrency=1 --test-skip-pattern="^TC-018-|^TC-010-002" tests/recording.test.cjs
  paths: *browser-inputs
  select:
  - tests/recording.test.cjs
  depends_on: [recording-storage]
  needs: Node 24, npm ci, Chromium and WSTX_SAMPLE_DIR. Windows PC; actual server/browser, spectrum/waterfall and desktop/mobile geometry.

- suite: recording-thin
  cost: 2
  run: cargo build --workspace --locked && node --test --test-concurrency=1 --test-name-pattern="^TC-010-002" tests/recording.test.cjs
  paths: *browser-inputs
  select:
  - tests/recording.test.cjs
  depends_on: [recording-display]
  needs: Node 24, npm ci, Chromium and WSTX_SAMPLE_DIR. Windows PC; actual TLS/browser and calibrated 32 kbit/s simulator, including full 60-second measurements.

- suite: recording-fixtures
  cost: 2
  run: node --test --test-concurrency=1 tests/recording-fixtures.test.cjs
  paths:
  - tests/recording-fixtures.test.cjs
  - tools/recording-fixtures.cjs
  - fixtures/decoder/
  - package.json
  - package-lock.json
  - .github/workflows/windows-rust.yml
  select:
  - tests/recording-fixtures.test.cjs
  - tools/recording-fixtures.cjs
  - fixtures/decoder/
  - package.json
  - package-lock.json
  needs: Node 24. Windows PC; offline pinned fixture setup/refusal tests. No download in the gate.

- suite: sysml-documentation
  cost: 2
  run: python tools/sysml.py check && python -m unittest discover -s tools/sysml/tests -q
  paths:
  - docs/WSTX Rust FSD.md
  - docs/sysml/
  - tools/sysml.py
  - tools/sysml/
  - .github/workflows/windows-rust.yml
  select:
  - docs/WSTX Rust FSD.md
  - docs/sysml/
  - tools/sysml.py
  - tools/sysml/
  needs: Python 3.12 and pinned Java/OMG Pilot setup. Windows PC; synchronization, semantics, architecture integrity and model/tool tests; no radio or live service.

- suite: fortran-reference-tools
  cost: 2
  run: python -m unittest discover -s tools -p "test_wsjtx*reference.py" -v && python -m unittest discover -s tools -p test_analyze_fortran_trace.py -v
  paths:
  - .github/workflows/fortran-stage-diagnostics.yml
  - fixtures/decoder/wsjtx-stage-logging.patch.gz
  - tools/reference_decode.rs
  - tools/wsjtx_reference.py
  - tools/test_wsjtx_reference.py
  - tools/WSJTX-REFERENCE.md
  - tools/wsjtx_stage_reference.py
  - tools/test_wsjtx_stage_reference.py
  - tools/analyze_fortran_trace.py
  - tools/test_analyze_fortran_trace.py
  - tools/wsjtx_simulator_components.py
  - fixtures/decoder/simulator-cases.json
  select:
  - .github/workflows/fortran-stage-diagnostics.yml
  - fixtures/decoder/wsjtx-stage-logging.patch.gz
  - tools/reference_decode.rs
  - tools/wsjtx_reference.py
  - tools/test_wsjtx_reference.py
  - tools/WSJTX-REFERENCE.md
  - tools/wsjtx_stage_reference.py
  - tools/test_wsjtx_stage_reference.py
  - tools/analyze_fortran_trace.py
  - tools/test_analyze_fortran_trace.py
  - tools/wsjtx_simulator_components.py
  - fixtures/decoder/simulator-cases.json
  needs: Python 3.12 standard library. Windows PC; 25 reference protocol, comparison, identity and trace-analyzer unit tests. No compiler, downloads, network, radio or hosted run.

- suite: decoder-quality
  cost: 2
  run: cargo test --release --locked --test decoder_signal -- --test-threads=1
  paths:
  - server/src/decoder/
  - server/src/lib.rs
  - server/tests/decoder_signal.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  select:
  - server/src/decoder/
  - server/src/lib.rs
  - server/tests/decoder_signal.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  needs: Pinned Rust and Python. Windows PC; all frozen decoder waveform, quality, rejection and runtime cases in release mode. WSTX_SAMPLE_DIR and WSTX_DECODER_OFFICIAL_FT8 must name verified reference recordings; optional verified WSTX_DECODER_CACHE, WSTX_DECODER_VECTORS and WSTX_DECODER_SYNCHRONIZATION reuse immutable inputs. No diagnostic case filter, radio, audio device or network download.

- suite: live-receive-integration
  cost: 2
  run: cargo test --release --locked --test audio_receive live_native_provider_decodes_independent_ft8_callsign -- --exact
  paths:
  - server/src/source.rs
  - server/src/audio.rs
  - server/src/audio/
  - server/src/receive.rs
  - server/src/decoder/
  - server/src/lib.rs
  - server/tests/audio_receive.rs
  - fixtures/radio/native_ft8_fixture.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  select:
  - server/src/source.rs
  - server/src/audio.rs
  - server/src/audio/
  - server/src/receive.rs
  - server/src/lib.rs
  - server/tests/audio_receive.rs
  - fixtures/radio/native_ft8_fixture.rs
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  depends_on: [decoder-quality]
  needs: Pinned Rust and Python. Windows PC; safe library APIs, deterministic injected native packets through the actual live source, shared receive window and pure FT8 decoder. WSTX_DECODER_VECTORS must name the verified 38-case frozen fixture cache. No transceiver, audio device, unsafe test import or network download; cheap provider boundary cases stay in the ordinary debug Rust group.

- suite: live-station-browser
  cost: 2
  run: cargo test --release --locked --bin wstx-rust receive_http_tests::live_native_ -- --nocapture
  paths:
  - server/src/main.rs
  - server/src/profile.rs
  - server/src/recording.rs
  - server/src/recording_http.rs
  - server/src/receive.rs
  - server/src/receive_http.rs
  - server/src/receive_http_tests.rs
  - server/src/source.rs
  - server/src/audio.rs
  - server/src/audio/
  - server/src/decoder/
  - server/src/lib.rs
  - client/
  - tests/receive-integration.test.cjs
  - fixtures/radio/native_ft8_fixture.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - package.json
  - package-lock.json
  select:
  - server/src/main.rs
  - server/src/profile.rs
  - server/src/recording.rs
  - server/src/recording_http.rs
  - server/src/receive.rs
  - server/src/receive_http.rs
  - server/src/receive_http_tests.rs
  - server/src/source.rs
  - server/src/audio.rs
  - server/src/audio/
  - server/src/decoder/
  - server/src/lib.rs
  - client/
  - tests/receive-integration.test.cjs
  - fixtures/radio/native_ft8_fixture.rs
  - fixtures/decoder/
  - server/Cargo.toml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - package.json
  - package-lock.json
  depends_on: [live-receive-integration]
  needs: Pinned Rust, Python, Node 24 and Playwright Chromium. Windows PC; actual isolated Router and production source/converter/receive owner/modem/browser with independently verified native packets. WSTX_DECODER_VECTORS must name the pinned 38-case frozen cache; verify-only, no gate-time download. Missing inputs fail closed. No physical audio device, CAT or network service. Cheap seeded manager/epoch/ring cases remain in debug.

- suite: operating-layout
  cost: 2
  run: cargo build --workspace --locked && node --test --test-concurrency=1 tests/ui-operating.test.cjs
  paths: *browser-inputs
  select:
  - tests/ui-operating.test.cjs
  - client/recording.js
  - client/recording.css
  - server/src/main.rs
  depends_on: [profiles]
  needs: Pinned Rust, Node 24 and Playwright Chromium. Windows PC; actual isolated server and browser, unsupported/no-input baseline, disabled TX/QSO/log, literal station identity, desktop/mobile/zoom layout and separator accessibility. No transceiver, audio activation or network service.

- suite: simulator-fixtures
  cost: 2
  run: >-
    python -m unittest discover -s tools -p test_wsjtx_simulated_samples.py -v &&
    python tools/wsjtx_simulated_samples.py --verify-manifest "$WSTX_SIMULATOR_SAMPLE_DIR/manifest.json" --fixture-directory fixtures/decoder &&
    python tools/wsjtx_simulated_samples.py --verify-manifest "$WSTX_SIMULATOR_SAMPLE_DIR/../ft8/manifest.json" --fixture-directory fixtures/decoder
  paths:
  - tools/wsjtx_simulated_samples.py
  - tools/test_wsjtx_simulated_samples.py
  - fixtures/decoder/simulator-cases.json
  - fixtures/decoder/independent-vector-tool/
  - fixtures/decoder/protocol-data/
  - docs/WSTX Rust FSD.md
  select:
  - tools/wsjtx_simulated_samples.py
  - tools/test_wsjtx_simulated_samples.py
  - fixtures/decoder/simulator-cases.json
  - fixtures/decoder/independent-vector-tool/
  - fixtures/decoder/protocol-data/
  needs: >-
    Python 3.12 standard library and the immutable CR18 portable fixture store,
    provisioned before the gate. Set WSTX_SIMULATOR_SAMPLE_DIR to its ft4 directory;
    its sibling ft8 directory is required. Set WSTX_SIMULATOR_ORACLE_DIR to
    fixtures/decoder for repository tests (portable tests default to sibling oracle).
    Preserve delivery-catalog.json and both mode manifests with the frozen store;
    missing files fail. Windows PC, isolated integrity/refusal tests and explicit
    verification of all eight WAVs; no download, compiler, decoder run or radio.

- suite: radio-selection
  cost: 2
  run: cargo test --release --locked --bin wstx-rust selection_http_tests::live_native_selection_ -- --nocapture && cargo build --locked && node --test --test-concurrency=1 tests/radio-selection.test.cjs
  paths: *browser-inputs
  select:
  - server/src/selection.rs
  - server/src/selection_http.rs
  - server/src/selection_http_tests.rs
  - server/src/radio_http.rs
  - server/src/radio_http_tests.rs
  - server/src/radio_control/
  - client/recording.js
  - client/recording.css
  - tests/radio-selection.test.cjs
  depends_on: [protocol, live-receive-integration]
  needs: Windows PC, pinned Rust/Python/Node/Chromium and verified WSTX_DECODER_VECTORS. Actual isolated station/receive owner, independent real-time native FT4/FT8 packets, literal typed serial fixture and two authenticated browsers on the existing32kbit TLS link. Both75s Thin/Off windows, all five known-answer contexts and observed pending polls are mandatory; no physical radio, device or production fault switch.

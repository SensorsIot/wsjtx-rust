# Harness configuration (https://github.com/SensorsIot/harness, branch V2, the submodule
# at harness/). Read by harness/core/tools/project.py.
project: wsjtx-rust
packs: [rust]
main: master
remote: origin
override_env: HARNESS_GATE_OVERRIDE
# Project binding; enforcement is the local hook and manual-only workflow trigger.
# The pinned generic harness does not interpret this field as an execution switch.
execution_mode: local

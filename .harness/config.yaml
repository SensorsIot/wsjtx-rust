# Harness configuration (https://github.com/SensorsIot/harness, branch main, the submodule
# at harness/). Read by harness/core/tools/project.py.
project: wsjtx-rust
packs: [rust, rust-supply-chain]
main: master
remote: origin
override_env: HARNESS_GATE_OVERRIDE
# Harness paths beyond harness/ and .harness/ (docs/harness/Harness-Overview.md). A push
# that changes only harness paths has no review and no gate.
harness_paths:
  - docs/harness/
  - AGENTS.md
  - CLAUDE.md
  - .claude/
  - deny.toml
  - .github/ISSUE_TEMPLATE/
  - .github/workflows/rust-advisories.yml
  - .gitmodules
# Select the authoritative execution location; the workflow has no automatic trigger.
execution_mode: local
# Three issue workspaces; the coordinator occupies this runtime's fourth agent slot.
parallel_workers: 3
# The push gate runs up to three selected suites at a time; the suites' exclusive/shared
# tags keep conflicting ones apart (docs/harness/Project-Specifics.md).
gate:
  # Shared compile cache for Rust builds (harness lang/rust "Shared compile cache"); sccache on HB9BLA.
  compile_cache: D:/sccache
  parallel: 3
  # protocol-thin, recording-thin and radio-selection-thin run beside other groups: measured
  # stable there (harness#28; Project-Specifics.md, Parallel groups). The CPU measurements
  # keep exclusive: ["*"], and the CPU-heavy decoder groups stay apart from protocol-thin and
  # recording-thin (link-measurement tag) in suites.yaml.
  timing_alone: false
  # D: has the room; C: reached 0 MB free beside the live station (harness#35). A machine
  # without D: falls back to the default; old folders in the default root are pruned too.
  cargo_target_root: D:/harness-cargo-target
  # The agents' own build and temp folders, one per worktree (docs/harness/Agent-Working-Rules.md,
  # "Role: coder"); landing a slice removes its folder there (harness Merge-Queue.md,
  # "One slice, one worktree").
  agent_build_root: D:/wstx-build
  # The model bindings for the gate's binding check and its report-only candidate
  # selection (harness core/tools/candidate.py, harness#40); reuses tools/sysml.py.
  model_bindings: python .harness/model_bindings.py --rev {rev}
# Regenerated by npm ci; the rust pack adds target/. test-results/ is left out: it holds
# screenshots and link reports that may be evidence, so cleanup refuses until it is moved.
build_output: [node_modules/]
# Project documents whose Role: sections add to the agent roles (harness#39).
role_additions: [docs/harness/Agent-Working-Rules.md]
# The merge queue (harness/core/docs/Merge-Queue.md) runs on HB9BLA. Its worker gates
# in its own worktree with the inputs of docs/harness/HB9BLA-HANDOFF.md. CARGO_BUILD_JOBS
# is left unbounded on purpose: the gate runs ABOVE_NORMAL and outranks only development
# work, the station runs above it (harness#28, docs/harness/Project-Specifics.md).
queue:
  batch: 4
  trailer: "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
  poll: 60
  comments: true
  # Each flake's comment goes here instead of to the issue of whichever CR it hit. The count is
  # `merge_queue.py history --flakes`.
  flake_issue: 8
  min_free_gb: 20
  build_dirs: [CARGO_TARGET_DIR]
  tools:
    - {name: node 24 or later, run: node --version, match: '^v(2[4-9]|[3-9][0-9])\.'}
    - {name: npm, run: npm --version}
    - {name: cargo, run: cargo --version}
    - {name: rustc, run: rustc --version}
    - {name: gh logged in, run: gh auth status}
    - name: MSVC link.exe
      platform: win32
      run: '"/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products "*" -find "VC/Tools/MSVC/*/bin/Hostx64/x64/link.exe"'
      match: 'link\.exe'
    # The gate's build output moved to D:, so min_free_gb no longer reads C:, which holds
    # TEMP and the live station (harness#35).
    - name: "20 GB free on C:"
      platform: win32
      run: test "$(df --output=avail -BG /c | tail -1 | tr -dc 0-9)" -ge 20
  env:
    WSTX_SAMPLE_DIR: "{common}/migration-data/recordings"
    WSTX_DECODER_CACHE: "{common}/migration-data/quality"
    WSTX_DECODER_VECTORS: "{common}/migration-data/frozen"
    WSTX_DECODER_SYNCHRONIZATION: "{common}/migration-data/synchronization"
    WSTX_DECODER_OFFICIAL_FT8: "{common}/migration-data/official-ft8/210703_133430.wav"
    WSTX_SIMULATOR_SAMPLE_DIR: "{common}/harness-parallel/resources/issue-18/delivery-v2/CR18-simulated-samples-v2-03aef7cde-toold06cee63463b/ft4"
    WSTX_SIMULATOR_ORACLE_DIR: "{worktree}/fixtures/decoder"
  setup:
    - {run: npm ci --ignore-scripts && npx playwright install chromium, when: [package-lock.json]}

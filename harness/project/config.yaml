# Harness configuration of the project harness (harness/project/; the general harness is
# https://github.com/SensorsIot/harness, branch main, the submodule at harness/general/).
# Read by harness/general/core/tools/project.py.
project: wsjtx-rust
packs: [rust, rust-supply-chain, python, javascript]
main: master
remote: origin
override_env: HARNESS_GATE_OVERRIDE
# Harness paths (harness/project/docs/Harness-Overview.md). A push that changes only
# harness paths has no review and no gate.
harness_paths:
  - harness/
  - AGENTS.md
  - CLAUDE.md
  - .claude/
  - .github/ISSUE_TEMPLATE/
  - .github/workflows/rust-advisories.yml
  - deny.toml
  - .gitmodules
# The one machine of the factory (harness/project/docs/specifics/machine.md, "Machine"):
# the gate and the queue worker start only here.
machines:
  HB9BLA:
    hostname: DESKTOP-HB9BLA
# Timing classes (harness core/docs/standards/testing.md, "Timing classes"). warn: reported
# only; red follows as its own harness change when timing_class.py reports nothing.
timing_classes:
  mode: warn
  clocks:
    real:
      - 'Instant::now'
      - 'SystemTime::now'
      - 'thread::sleep'
      - 'time::sleep\('
      - '\.elapsed\(\)'
      - 'Date\.now\('
      - 'performance\.now\('
      - 'setTimeout\('
      - 'waitForTimeout\('
    cpu:
      - 'GetProcessTimes'
      - 'QueryProcessCycleTime'
      - 'process_time\('
      - 'cpu_time'
    injected:
      - 'start_paused'
      - 'time::(pause|advance)\('
      - 'page\.clock\.'
  classes:
    signal:  {clocks: [],                isolation: any,   red: never}
    radio:   {clocks: [real],            isolation: alone, red: rerun}
    display: {clocks: [injected, real],  isolation: any,   red: flake}
    clock:   {clocks: [injected],        isolation: any,   red: never}
    compute: {clocks: [real, cpu],       isolation: alone, red: inconclusive}
    timer:   {clocks: [injected],        isolation: any,   red: never}
# Select the authoritative execution location; the workflow has no automatic trigger.
execution_mode: local
# Six issue workspaces: a workspace is held until its CR lands, so finished CRs waiting for the
# one-at-a-time merge queue do not block new work; Alex's coders (alex.machines.implement) take
# their share of them; no build in the coordinator's workspace while a gate runs.
parallel_workers: 6
# The push gate runs up to three selected suites at a time; the suites' exclusive/shared
# tags keep conflicting ones apart (harness/project/docs/specifics/local-windows-development.md,
# "Parallel groups and shared resources").
gate:
  # Shared compile cache for Rust builds (harness lang/rust "Shared compile cache"); sccache on HB9BLA.
  compile_cache: D:/sccache
  parallel: 3
  # protocol-thin, recording-thin and radio-selection-thin run beside other groups: measured
  # stable there (harness/project/docs/specifics/local-windows-development.md,
  # Parallel groups and shared resources). The CPU measurements
  # keep exclusive: ["*"], and the CPU-heavy decoder groups stay apart from protocol-thin and
  # recording-thin (link-measurement tag) in harness/project/suites/.
  timing_alone: false
  # On D:, which has the room; C: holds TEMP and the live station. A machine without D:
  # falls back to the default; old folders in the default root are pruned too.
  cargo_target_root: D:/harness-cargo-target
  # The agents' own build and temp folders, one per worktree (harness/project/docs/Agent-Working-Rules.md,
  # "Role: coder"); landing a CR removes its folder there (harness Merge-Queue.md,
  # "One CR, one worktree").
  agent_build_root: D:/wstx-build
  # The model bindings for the gate's binding check and its report-only candidate
  # selection (harness core/tools/candidate.py); reuses tools/sysml.py.
  model_bindings: python harness/project/model_bindings.py --rev {rev}
# Regenerated by npm ci; the rust pack adds target/. test-results/ is left out: it holds
# screenshots and link reports that may be evidence, so cleanup refuses until it is moved.
build_output: [node_modules/, test-results/, server/test-results/]
# Project documents whose Role: sections add to the agent roles.
role_additions: [harness/project/docs/Agent-Working-Rules.md]
# The project's model rules, appended to the generated skills under "## This project": the
# finished model wins where it fixes a form.
skill_additions:
  sysml-authoring: [harness/project/docs/Finished-Model.md]
  test-design: [harness/project/docs/Finished-Model.md#m6-requirements-clauses-and-tests]
  conformance-review: [harness/project/docs/Finished-Model.md]
# The ratchets (harness/general/core/docs/Harness-Changes.md, The ratchet): the product knows no
# test (TR-24 of tools/sysml/README.md); its exception list only shrinks.
ratchets:
  product-knows-no-test:
    command: python tools/sysml.py test-hooks
    exceptions: tools/sysml/product-knows-no-test.txt
# The merge queue (harness/general/core/docs/Merge-Queue.md) runs on HB9BLA. Its worker gates
# in its own worktree with the inputs of harness/project/docs/specifics/local-windows-development.md ("Inputs").
# CARGO_BUILD_JOBS is left unbounded on purpose: the gate runs ABOVE_NORMAL and outranks
# only development work, the station runs above it (harness/project/docs/specifics/merge-queue.md, "Merge queue").
queue:
  batch: 4
  trailer: "Co-Authored-By: Claude Opus 5.5 <noreply@anthropic.com>"
  poll: 60
  comments: true
  # null: a flake is commented on the CR whose gate saw it; `merge_queue.py history --flakes`
  # keeps the count.
  flake_issue: null
  min_free_gb: 20
  build_dirs: [CARGO_TARGET_DIR]
  tools:
    - {name: node 24 or later, run: node --version, match: '^v(2[4-9]|[3-9][0-9])\.'}
    - {name: npm, run: npm --version}
    - {name: cargo, run: cargo --version}
    - {name: rustc, run: rustc --version}
    - {name: gh logged in, run: gh auth status}
    - name: MSVC link.exe
      platform: win32
      run: '"/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products "*" -find "VC/Tools/MSVC/*/bin/Hostx64/x64/link.exe"'
      match: 'link\.exe'
    # The gate's build output is on D:, so min_free_gb does not read C:, which holds TEMP
    # and the live station.
    - name: "20 GB free on C:"
      platform: win32
      run: test "$(df --output=avail -BG /c | tail -1 | tr -dc 0-9)" -ge 20
  env:
    WSTX_SAMPLE_DIR: "{common}/migration-data/recordings"
    WSTX_DECODER_CACHE: "{common}/migration-data/quality"
    WSTX_DECODER_VECTORS: "{common}/migration-data/frozen"
    WSTX_DECODER_SYNCHRONIZATION: "{common}/migration-data/synchronization"
    WSTX_DECODER_OFFICIAL_FT8: "{common}/migration-data/official-ft8/210703_133430.wav"
    WSTX_SIMULATOR_SAMPLE_DIR: "{common}/migration-data/CR18-simulated-samples-v2-03aef7cde-toold06cee63463b/ft4"
    WSTX_SIMULATOR_ORACLE_DIR: "{worktree}/fixtures/decoder"
  setup:
    - {run: npm ci --ignore-scripts && npx playwright install chromium, when: [package-lock.json]}

# Investment classes (harness core/docs/CR-Process.md, "Classes of change"). The tool class
# covers the model tools and the metadata definitions they read (ModelBindings); the station
# scripts under tools/deploy and the reference tools stay product paths, since a tool change
# skips Install and Accept.
classes:
  # A model restructuring (commits touching only docs/sysml/) is proven by `equivalence`
  # (TR-21, tools/sysml/README.md) and needs no Review. A code restructuring and a refactor
  # are proven by the code proof (TR-23): the test inventory, the model check at the head
  # and the trace listing, each read at a revision.
  restructuring:
    label: restructuring
    proof:
      inventory: python tools/sysml.py tests {rev}
      model: python tools/sysml.py check {rev}
      traces: python tools/sysml.py traces {rev}
      equivalence: python tools/sysml.py equivalence {base} {head}
      model_paths: [docs/sysml/]
  tool: {label: tool, paths: [tools/sysml.py, tools/sysml/, docs/sysml/shared/ModelBindings.sysml]}
  # A text change (comments, tags, bindings) is proven by text_proof.py; a changed file under
  # these paths keeps a short Review.
  text: {label: text, paths: [docs/sysml/]}
  # A test change touches only test files (the packs' patterns) and the test tools.
  test: {label: test, paths: [tools/test/]}

# The meter (report_cr.py --meter, harness core/docs/CR-Reporting.md "The meter").
# List prices, USD per million tokens (Anthropic first-party rates, 2026-11);
# cache writes default to 1.25x (5 min) and 2x (1 h) input. Haiku 5.5's cache read
# is 0.1x input by the usual ratio. A relation, not a bill.
meter:
  host: claude
  # The day Alex runs under the current rules; the queue history and the refusal log start
  # there. The improvement run (Jonah) follows 10 changes Alex pulled from Define to Land since
  # then; `report_cr.py --meter` counts them.
  rules_start: 2026-11-22
  prices:
    claude-opus-5-5: {input: 4, output: 20, cache_read: 0.20}
    claude-sonnet-5-5: {input: 2, output: 10, cache_read: 0.10}
    claude-haiku-5-5: {input: 0.10, output: 0.50, cache_read: 0.01}
    claude-fable-5-2: {input: 8, output: 40, cache_read: 0.20}

# Define writes into the model in a workspace of its own, only under these paths (harness#208).
define:
  scope: [docs/sysml, tools/sysml]
  model_check: "python tools/sysml.py check {rev}"

# Alex, the coordinator's state machine (harness core/docs/Alex.md, "The numbers").
alex:
  machines: {define: 2, check: 1, implement: 2, review: 1, coordinate: 1, test: 2}
  limits: {ready: 3, queued_landed: 2}
  buffer_per_coder: 2
  fuse_minutes: {define: 180, check: 60, implement: 360, review: 90, gate: 90, coordinate: 60, test: 120}
  # The operator's priority front; with only_first false Alex takes every open CR he may pull (After: first).
  first: [119, 129, 211, 109, 106, 107, 132]
  only_first: false
  decide: true
  skip_labels: []
  restrictions:
    - until_accepted: 239
      lifted_at_station: true
      brief: "Live tests key the simulator: the IC-7300 emulator (SIM-IC7300) and the band simulator. In a station session, with the operator at the station, the real IC-7300 may be keyed (wsjtx-rust#239)."
  # The station tester's MCP servers: the band simulator only; each station run starts and stops
  # its own IC-7300 emulator on COM5 with tools/test/powershell/emulator.ps1 (one owner of the port).
  launcher: {command: claude, permission_mode: auto, model: claude-opus-5-5, mcp: {station: harness/project/mcp/station.json}}
  # Install: the one deploy command (harness/project/docs/specifics/deployment-authority.md,
  # Deployment authority), given the
  # commit the merge queue pushed; Git Bash by its full path (a bare bash finds WSL). Exit 3: the
  # station stayed busy; 6: the radio did not answer; nothing changed in either.
  install:
    dry_run: ["C:/Program Files/Git/bin/bash.exe", "-c", "set -o pipefail; git -C D:/Github/wsjtx-rust show {commit}:tools/deploy/station-update/make_package.py | python - {commit} --dry-run"]
    deploy: ["C:/Program Files/Git/bin/bash.exe", "-c", "set -o pipefail; git -C D:/Github/wsjtx-rust show {commit}:tools/deploy/station-update/make_package.py | python - {commit}"]
    policy: "the standing deploy policy of harness/project/docs/specifics/deployment-authority.md"
    wait_exits: [3, 6]
    timeout_minutes: 45
  accept:
    consent: {levels: [4, 5], policy: "the standing consent at 1 % of harness/project/docs/specifics/deployment-authority.md"}
  poll: 120

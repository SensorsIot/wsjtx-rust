- suite: recording-fixtures
  cost: 2
  run: node --test --test-concurrency=1 tests/profile/recording-fixtures.test.cjs tools/recording-fixtures.test.cjs
  filter: >-
    python harness/project/tools/filter_run.py recording-fixtures {filter}
    @node node --test --test-concurrency=1 tests/profile/recording-fixtures.test.cjs tools/recording-fixtures.test.cjs
  paths:
  - tests/profile/recording-fixtures.test.cjs
  - tools/recording-fixtures.cjs
  - tools/recording-fixtures.test.cjs
  - fixtures/decoder/
  - package.json
  - package-lock.json
  - .github/workflows/windows-rust.yml
  # The recording limits the provenance sweep reads (Recordings.sysml), the unit suffixes
  # (Units.sysml) and the JavaScript model-value reader.
  - docs/sysml/backend/profile/Recordings.sysml
  - docs/sysml/shared/Units.sysml
  - tools/test/node/model-values.cjs
  select:
  - tests/profile/recording-fixtures.test.cjs
  - tools/recording-fixtures.cjs
  - tools/recording-fixtures.test.cjs
  - fixtures/decoder/
  - package.json
  - package-lock.json
  - docs/sysml/backend/profile/Recordings.sysml
  - docs/sysml/shared/Units.sysml
  - tools/test/node/model-values.cjs
  needs: Node 24 and WSTX_SAMPLE_DIR with verified original recordings (TC-018-001 provenance sweep). Windows PC; offline pinned fixture setup/refusal tests. No download in the gate.

- suite: radio-selection-thin
  cost: 2
  run: cargo test --release --locked --bin wstx-rust selection_http_tests::live_native_selection_tls_thin_and_off -- --nocapture
  # No filter form: the run is exactly one test, so the whole suite is that test.
  paths:
  - server/
  - client/
  - tests/
  - tools/test/
  - fixtures/decoder/
  - tools/recording-fixtures.cjs
  - docs/sysml/
  - .github/workflows/windows-rust.yml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - package.json
  - package-lock.json
  timing: true
  # Timing for the 4230-5000 ms native setup, of which this suite is the only oracle: CAT
  # (the radio control files listed below), the router, compression, the selection reads, the receive
  # and spectrum pushes, the clients that read them, its Rust and browser test files and their
  # helpers, the toolchain and the dependency versions. Not capture (source.rs, audio): it reaches
  # the browsers only through the owners above. Not recording.css or the Cargo.toml and package.json
  # pins. No 32 kbit/s link; it shares link-measurement so that the CPU-heavy decoder groups
  # do not run beside it.
  timing_inputs:
  - server/src/main.rs
  - server/src/web/listener.rs
  - server/src/web/content_coding.rs
  - server/src/supervisor/selection.rs
  - server/src/supervisor/selection_http.rs
  - server/src/supervisor/selection_http_tests.rs
  - server/src/radioControl/cat_lifecycle.rs
  - server/src/radioControl/mod.rs
  - server/src/radioControl/actor.rs
  - server/src/radioControl/catalogue.rs
  - server/src/radioControl/codec.rs
  - server/src/radioControl/executor.rs
  - server/src/radioControl/executor_tests.rs
  - server/src/radioControl/ic7300-catalogue.json
  - server/src/radioControl/setup.rs
  - server/src/radioControl/setup_tests.rs
  - server/src/radioControl/windows.rs
  - server/src/radioControl/windows_tests.rs
  - server/src/radioControl/cat_lifecycle_tests.rs
  - server/src/radioControl/radio_agc.rs
  - server/src/radioControl/radio_agc_tests.rs
  - server/src/receive/receive.rs
  - server/src/receive/receive_http.rs
  - server/src/receive/spectrum.rs
  - client/src/frontend/app.js
  - client/src/frontend/index.html
  - client/src/frontend/recording.js
  - tests/radio-selection.test.cjs
  - tools/test/node/selection-evidence.cjs
  - tools/test/node/support.cjs
  - tools/test/blocked-ports.json
  - Cargo.lock
  - rust-toolchain.toml
  - package-lock.json
  build:
  - cargo build --workspace --locked
  - cargo test --release --locked --bin wstx-rust --no-run
  exclusive: [radio-selection-evidence]
  shared: [link-measurement]
  timing_classes: [display]
  needs: "Windows PC, pinned Rust/Python/Node/Chromium and verified WSTX_DECODER_VECTORS. Timing suite: actual isolated station/receive owner, independent real-time native FT4/FT8 packets, literal typed serial fixture and two authenticated browsers on an unshaped TLS connection. Thin and Off windows as long as their gestures need, every known-answer context and pending seen through an event or a read; no physical radio, device or production fault switch. Runs only when the router, compression, the selection, CAT, receive or spectrum code, the status and receive/selection clients (app.js, index.html, recording.js), its Rust and browser test files and helpers, the toolchain or the dependency versions change, or on request (Harness-Timing: yes)."

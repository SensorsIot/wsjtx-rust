- suite: operating-layout
  cost: 2
  run: cargo build --workspace --locked && node --test --test-concurrency=1 tests/ui-operating.test.cjs
  filter: >-
    python harness/project/tools/filter_run.py operating-layout {filter}
    @run cargo build --workspace --locked
    @node node --test --test-concurrency=1 tests/ui-operating.test.cjs
  paths:
  - server/
  - client/
  - tests/
  - tools/test/
  - fixtures/decoder/
  - tools/recording-fixtures.cjs
  - docs/sysml/
  - .github/workflows/windows-rust.yml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - package.json
  - package-lock.json
  select:
  - server/src/main.rs
  - server/src/web/listener.rs
  - server/src/profile.rs
  - server/src/receive/recording.rs
  - server/src/radioControl/radio_connection.rs
  - server/src/receive/receive.rs
  - server/src/receive/receive_http.rs
  - server/src/receive/receive_diagnostics.rs
  - server/src/supervisor/receive_startup.rs
  - server/src/operating/qso/contact_http.rs
  - server/src/log/logbook.rs
  - server/src/log/logbook_http.rs
  - server/src/strategy.rs
  - server/src/contest.rs
  - server/src/operating/qso/freeslot.rs
  - server/src/udp/udp.rs
  - server/src/transmit/transmit_http.rs
  - client/src/frontend/app.js
  - client/src/frontend/index.html
  - client/src/frontend/style.css
  - client/src/frontend/authorization.js
  - client/src/frontend/recording.js
  - client/src/frontend/recording.css
  - client/src/frontend/contact.js
  - client/src/frontend/logbook.js
  - tests/ui-operating.test.cjs
  - tools/test/node/quiet-press.cjs
  - tools/test/node/support.cjs
  - tools/test/blocked-ports.json
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - server/Cargo.toml
  - package.json
  - package-lock.json
  build: cargo build --workspace --locked
  needs: Pinned Rust, Node 24 and Playwright Chromium. Windows PC; actual isolated server and browser, unsupported/no-input baseline, disabled TX/QSO/log, literal station identity, desktop/mobile/zoom layout and separator accessibility. No transceiver, audio activation or network service.

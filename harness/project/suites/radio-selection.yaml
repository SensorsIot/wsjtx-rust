- suite: radio-selection
  cost: 2
  run: "cargo test --release --locked --bin wstx-rust selection_http_tests::live_native_selection_commission_ -- --nocapture && cargo test --release --locked --bin wstx-rust selection_http_tests::selection_state_ -- --nocapture && cargo build --workspace --locked && node --test --test-concurrency=1 tests/radio-selection.test.cjs"
  filter: >-
    python harness/project/tools/filter_run.py radio-selection {filter}
    @libtest cargo test --release --locked --bin wstx-rust selection_http_tests::live_native_selection_commission_ -- --nocapture
    @libtest cargo test --release --locked --bin wstx-rust selection_http_tests::selection_state_ -- --nocapture
    @run cargo build --workspace --locked
    @node node --test --test-concurrency=1 tests/radio-selection.test.cjs
  paths:
  - server/
  - client/
  - tests/
  - tools/test/
  - fixtures/decoder/
  - tools/recording-fixtures.cjs
  - docs/sysml/
  - .github/workflows/windows-rust.yml
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - package.json
  - package-lock.json
  select:
  - docs/sysml/
  - server/src/main.rs
  - server/src/web/listener.rs
  - server/src/web/content_coding.rs
  - server/src/supervisor/selection.rs
  - server/src/supervisor/selection_http.rs
  - server/src/supervisor/selection_http_tests.rs
  - server/src/radioControl/mod.rs
  - server/src/radioControl/actor.rs
  - server/src/radioControl/catalogue.rs
  - server/src/radioControl/codec.rs
  - server/src/radioControl/executor.rs
  - server/src/radioControl/executor_tests.rs
  - server/src/radioControl/ic7300-catalogue.json
  - server/src/radioControl/setup.rs
  - server/src/radioControl/setup_tests.rs
  - server/src/radioControl/windows.rs
  - server/src/radioControl/windows_tests.rs
  - server/src/radioControl/cat_lifecycle_tests.rs
  - server/src/radioControl/radio_agc.rs
  - server/src/radioControl/radio_agc_tests.rs
  - server/src/radioControl/radio_http.rs
  - server/src/radioControl/radio_http_tests.rs
  - server/src/radioControl/radio_connection.rs
  - server/src/radioControl/cat_lifecycle.rs
  - server/src/receive/recording.rs
  - server/src/receive/receive.rs
  - server/src/receive/receive_http.rs
  - server/src/audio/source.rs
  - server/src/auth_tests.rs
  - client/src/frontend/recording.js
  - client/src/frontend/recording.css
  - tests/radio-selection.test.cjs
  - tools/test/node/selection-evidence.cjs
  - tools/test/node/support.cjs
  - tools/test/blocked-ports.json
  - tools/test/node/model-values.cjs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - server/Cargo.toml
  - package.json
  - package-lock.json
  - client/src/frontend/app.js
  - client/src/frontend/index.html
  - client/src/frontend/authorization.js
  build:
  - cargo build --workspace --locked
  - cargo test --release --locked --bin wstx-rust --no-run
  exclusive: [radio-selection-evidence]
  needs: "Windows PC, pinned Rust/Python/Node/Chromium. Functional: commissioning with zero native effects and the browser selection cases of tests/radio-selection.test.cjs. The two-browser Thin/Off selection workload runs in radio-selection-thin."

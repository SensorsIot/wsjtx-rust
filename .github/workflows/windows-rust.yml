name: Windows Rust

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 MSVC
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out Rust project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc

      - name: Report compiler and build environment
        run: |
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust warnings
        run: cargo clippy --workspace --locked --all-targets --target x86_64-pc-windows-msvc -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --all-targets --target x86_64-pc-windows-msvc

      - name: Compile Windows release executable
        run: cargo build --workspace --locked --release --target x86_64-pc-windows-msvc

      - name: Install browser test dependencies
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Install Chromium and test packages
        run: |
          npm ci --ignore-scripts
          npx playwright install chromium

      - name: Test packaged server and real browser
        env:
          WSTX_TEST_EXE: target/x86_64-pc-windows-msvc/release/wstx-rust.exe
        run: npm test

      - name: Upload Windows executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wstx-rust-windows-x64
          path: target/x86_64-pc-windows-msvc/release/wstx-rust.exe
          if-no-files-found: error
          retention-days: 14
